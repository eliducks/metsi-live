<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Announcements | METSI</title>
<style>
:root{
  --black:#000;--ink:#0a0a0a;--red:#ff1a1a;--paper:#f4f2f0;--mute:rgba(244,242,240,.64);--line:rgba(244,242,240,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);--wipe:cubic-bezier(.76,0,.24,1);
  box-sizing:border-box;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#000;color:var(--paper);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100dvh}
[hidden]{display:none!important}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#000 100%)}
.view{position:relative;z-index:2}

/* buttons */
.btn{display:inline-block;font:600 17px/1 var(--font);letter-spacing:.01em;color:#fff;background:var(--red);border:0;border-radius:999px;padding:18px 40px;cursor:pointer;text-decoration:none;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(255,26,26,.45)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
.btn.ghost{background:transparent;border:1px solid var(--red);color:var(--paper)}
.btn.ghost:hover{background:var(--red);color:#fff}
#enter{position:relative;isolation:isolate;padding:18px 46px}
#enter::before{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;animation:ring 2.8s ease-out infinite 2.6s}
#enter::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%) no-repeat -150% 0/60% 100%;animation:sheen 3.4s ease-in-out infinite 2.8s}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,26,26,.6)}70%,100%{box-shadow:0 0 0 26px rgba(255,26,26,0)}}
@keyframes sheen{0%{background-position:-150% 0}55%,100%{background-position:250% 0}}

/* splash */
#splash{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
.logo{width:min(80vw,440px);height:auto;display:block;
  clip-path:inset(47% 0 47% 0);opacity:0;animation:slit 1.3s var(--wipe) .3s forwards}
@keyframes slit{to{clip-path:inset(0);opacity:1}}
.fade{opacity:0;animation:fadein 1s ease forwards}
.intro .q{display:block;margin-bottom:14px;font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.15;color:var(--paper)}
@keyframes fadein{to{opacity:1}}
.intro{margin-top:40px;max-width:42ch;font-size:clamp(17px,2.4vw,20px);line-height:1.55;color:var(--mute);animation-delay:1.5s}
#enter{margin-top:44px;animation-delay:1.9s}

/* main */
#main{--mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.sec{padding:clamp(80px,12vw,160px) clamp(20px,5vw,56px);max-width:1280px;margin:0 auto;scroll-margin-top:72px}
.label{font:500 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:28px}
.label b{color:var(--red);font-weight:500;margin-right:8px}
.rv{opacity:0;transform:translateY(32px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.btn.sm{padding:11px 22px;font-size:14px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(20px,5vw,56px);background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav img{width:104px;height:auto;display:block}
.nav-links{display:flex;gap:32px;margin-left:auto;margin-right:24px}
.nav-links button{background:none;border:0;color:var(--mute);font:500 15px var(--font);cursor:pointer;padding:6px 0;transition:color .25s}
.nav-links button:hover{color:var(--paper)}
@media (max-width:640px){.nav-links{display:none}.nav{padding-top:12px;padding-bottom:12px}}

.hero{min-height:calc(100dvh - 70px);display:flex;flex-direction:column;justify-content:center;padding:48px clamp(20px,5vw,56px) 80px;max-width:1280px;margin:0 auto}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font:500 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:10px 16px;margin-bottom:28px;background:rgba(10,10,10,.6)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.8s infinite}
@keyframes blink{0%{box-shadow:0 0 0 0 rgba(255,26,26,.7)}70%,100%{box-shadow:0 0 0 10px rgba(255,26,26,0)}}
.hl{font-weight:800;letter-spacing:-.05em;line-height:1}
.ln{display:block;overflow:hidden;padding:.04em .02em .12em}
.ln>span{display:block;transform:translateY(112%)}
.ln.big{font-size:clamp(84px,27vw,380px)}
.ln.sm{font-size:clamp(26px,5.6vw,72px);letter-spacing:-.035em}
.ln.sm i{font-style:normal;color:var(--red)}
.rule{display:block;height:3px;background:var(--red);transform:scaleX(0);transform-origin:left}
.play .rule{animation:draw 1.2s var(--wipe) .15s forwards}
.play .ln.big>span{animation:up 1.2s var(--ease) .55s forwards}
.play .ln.sm>span{animation:up 1.1s var(--ease) 1.1s forwards}
@keyframes draw{to{transform:scaleX(1)}}
@keyframes up{to{transform:translateY(0)}}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px 48px;flex-wrap:wrap;margin-top:28px}
.hero-side{max-width:38ch}
.hero-side p{color:var(--mute);font-size:clamp(17px,2vw,19px);line-height:1.55;margin-bottom:28px}
.cta{display:flex;flex-wrap:wrap;gap:12px}

.marquee{background:var(--red);color:#000;overflow:hidden;padding:16px 0;border-block:1px solid #000}
.track{display:flex;align-items:center;gap:32px;width:max-content;animation:marq 32s linear infinite;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;font-size:clamp(20px,3.2vw,34px);white-space:nowrap}
.track i{width:.42em;height:.42em;border-radius:50%;background:#000;display:block}
@keyframes marq{to{transform:translateX(-50%)}}

.about-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:48px 80px;align-items:end}
.about h2{font-size:clamp(46px,8.5vw,120px);font-weight:800;letter-spacing:-.05em;line-height:.95}
.about h2 em{font-style:normal;color:var(--red)}
.lead{font-size:clamp(22px,2.8vw,32px);line-height:1.25;font-weight:600;letter-spacing:-.02em;margin-bottom:20px}
.about-grid p:not(.lead){color:var(--mute);font-size:clamp(17px,2vw,19px);line-height:1.6;max-width:44ch}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:clamp(56px,8vw,96px);background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.pillar{background:#000;padding:clamp(24px,3vw,40px);min-height:250px;display:flex;flex-direction:column;justify-content:space-between;gap:48px;transition:background .4s,box-shadow .4s}
.pillar:hover{background:var(--ink);box-shadow:inset 0 3px 0 var(--red)}
.pillar .num{font:500 13px/1 var(--mono);color:var(--red);letter-spacing:.14em}
.pillar h3{font-size:clamp(22px,2.4vw,28px);font-weight:700;letter-spacing:-.025em;line-height:1.15;margin-bottom:12px}
.pillar p{color:var(--mute);line-height:1.55}

.recent-grid{display:grid;grid-template-columns:1fr minmax(0,420px);gap:56px 96px;align-items:center}
.recent h2{font-size:clamp(40px,7vw,88px);font-weight:800;letter-spacing:-.045em;line-height:.95;margin-bottom:24px}
.recent-copy p:not(.label){color:var(--mute);font-size:clamp(17px,2vw,19px);line-height:1.6;max-width:40ch;margin-bottom:32px}
.phone{width:100%;max-width:420px;justify-self:end;padding:10px;border-radius:40px;background:linear-gradient(160deg,#1c1c1c,#050505);border:1px solid var(--line);box-shadow:0 40px 120px -20px rgba(255,26,26,.28)}
.screen{position:relative;border-radius:30px;overflow:hidden;background:#000;min-height:620px}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transition:opacity .6s ease}
.screen iframe.on{opacity:1;pointer-events:auto}
.igf{padding:28px 22px}
.igf-head{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.igf-av{width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#ff1a1a,#5a0000,#ff1a1a)}
.igf-av span{width:100%;height:100%;border-radius:50%;background:#000;display:grid;place-items:center;font-weight:800;font-size:24px;letter-spacing:-.04em}
.igf-head b{display:block;font-size:17px;margin-bottom:4px}
.igf-head small{color:var(--mute);font-size:14px}
.igf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:22px}
.tile{aspect-ratio:1;border-radius:6px;position:relative;overflow:hidden;background:#0d0d0d;display:block;transition:transform .4s var(--ease)}
.tile::before{content:'';position:absolute;inset:0;background:linear-gradient(calc(var(--a,115)*1deg),transparent 35%,rgba(255,26,26,var(--o,.5)) 50%,transparent 65%)}
.tile:hover{transform:scale(.96)}
.igf .btn{display:block;text-align:center}

.band{text-align:center;padding:clamp(80px,12vw,150px) 24px;border-top:1px solid var(--line)}
.band h2{font-size:clamp(40px,8vw,104px);font-weight:800;letter-spacing:-.05em;line-height:1;margin-bottom:36px}
.band h2 em{color:var(--red);font-style:normal}
.foot{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;padding:32px clamp(20px,5vw,56px) 40px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.foot img{width:84px;height:auto;display:block}
.foot a{color:var(--paper);text-decoration:none}
.foot a:hover{color:var(--red)}
@media (max-width:480px){.btn{padding:16px 26px;font-size:16px}.btn.sm{padding:10px 18px;font-size:14px}}
@media (max-width:860px){
  .about-grid,.recent-grid{grid-template-columns:1fr}
  .pillars{grid-template-columns:1fr}.pillar{min-height:0}
  .phone{justify-self:center}
}


/* ideas batch: hold button, statement of the day, field, reader */
.sotd{position:absolute;top:clamp(28px,8vh,72px);left:0;right:0;padding:0 24px;text-align:center;animation-delay:2.4s}
.sotd small,.sign,#holdmsg,.rs{font:500 12px/1 "SF Mono",ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase}
.sotd small{display:block;color:var(--red);margin-bottom:10px;font-size:11px}
.sotd span{display:inline-block;font-size:clamp(16px,2.2vw,22px);font-weight:600;letter-spacing:-.015em;color:rgba(244,242,240,.82);animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(-8px);opacity:.65}}
.sign{position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(244,242,240,.4);animation-delay:2.6s}
.hold{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:14px;animation-delay:1.9s}
#enter.holdbtn{margin-top:0;padding:0;width:132px;height:132px;border:0;border-radius:50%;background:rgba(10,10,10,.7);color:var(--paper);display:grid;place-items:center;font:600 15px/1.25 var(--font);text-align:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#enter.holdbtn::after{display:none}
#enter.holdbtn:focus-visible{outline:2px solid #fff;outline-offset:6px}
.holdbtn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.holdbtn .trk{fill:none;stroke:rgba(244,242,240,.18);stroke-width:3}
.holdbtn .bar{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3}
#holdmsg{min-height:1.2em;color:var(--mute)}
.stage{position:relative;height:clamp(640px,80vh,760px);border:1px solid var(--line);border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,rgba(255,26,26,.1),transparent 65%),#050505}
.st{position:absolute;max-width:44%;background:none;border:0;color:var(--paper);font:600 clamp(15px,1.7vw,24px)/1.25 var(--font);letter-spacing:-.015em;text-align:left;cursor:pointer;opacity:var(--o,.55);transform:translate(var(--tx,0px),var(--ty,0px)) scale(var(--s,1));transition:transform .6s var(--ease),opacity .4s,text-shadow .4s}
.st span{display:block;animation:float var(--t,9s) ease-in-out infinite alternate}
.st:hover,.st:focus-visible{opacity:1;--s:1.12;text-shadow:0 0 28px rgba(255,26,26,.8);z-index:2;outline:none}
@keyframes float{to{transform:translate(var(--fx,8px),var(--fy,-10px))}}
@media (max-height:720px){.sotd{display:none}}
.hint{margin-top:16px;color:var(--mute);font-size:14px}
#reader{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.97);display:grid;place-content:center;padding:32px;text-align:center;cursor:pointer;animation:ovin .5s ease both}
.rt{font-size:clamp(30px,6vw,76px);font-weight:800;letter-spacing:-.04em;line-height:1.05;max-width:18ch;margin:0 auto;opacity:0;transform:translateY(14px);transition:opacity 1.4s ease,transform 1.4s var(--ease)}
.rs{margin-top:28px;color:var(--mute);opacity:0;transition:opacity 1s ease .8s}
.rt.on,.rs.on{opacity:1;transform:none}

/* page transition */
#launch{position:fixed;inset:0;z-index:60;background:#000;pointer-events:none;animation:ovin .9s cubic-bezier(.4,0,.2,1) both}
#launch canvas{display:block;width:100%;height:100%}
#launch.out{animation:dissolve 1.4s cubic-bezier(.4,0,.6,1) forwards}
@keyframes ovin{from{opacity:0}to{opacity:1}}
#splash.leaving{animation:leave .8s ease forwards}
@keyframes leave{to{opacity:0;transform:scale(.97);filter:blur(8px)}}
@keyframes dissolve{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(22px);transform:scale(1.08)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  #enter::before,#enter::after,.st span,.sotd span{animation:none!important}
}

/* say it back */
.say-grid{display:grid;grid-template-columns:1fr minmax(240px,380px);gap:40px 64px;align-items:start}
.say textarea{width:100%;resize:vertical;background:transparent;color:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 22px;font:600 clamp(20px,2.4vw,28px)/1.25 var(--font);letter-spacing:-.02em;margin-bottom:12px}
.say textarea:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.say .btn{margin-top:24px}
#cv{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px}
@media(max-width:820px){.say-grid{grid-template-columns:1fr}}

/* moderation popup */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .35s var(--ease)}
#modal.on{opacity:1}
#modal .mbox{position:relative;width:100%;max-width:520px;background:var(--ink);border:1px solid var(--line);border-radius:28px;padding:clamp(36px,6vw,56px) clamp(28px,6vw,52px) clamp(28px,6vw,48px);box-shadow:0 30px 120px rgba(255,26,26,.18);transform:translateY(24px) scale(.97);transition:transform .5s var(--ease)}
#modal.on .mbox{transform:none}
#modal .mbox::before{content:'';position:absolute;top:0;left:clamp(28px,6vw,52px);width:64px;height:4px;background:var(--red);border-radius:0 0 4px 4px}
#modal h3{font-size:clamp(32px,6vw,48px);font-weight:800;letter-spacing:-.045em;line-height:1;margin-bottom:20px}
#modal p{color:var(--mute);font-size:clamp(17px,2vw,19px);line-height:1.6;margin-bottom:32px}
@media(prefers-reduced-motion:reduce){#modal,#modal .mbox{transition:none}}

/* announcements link */
.nav-links a{color:var(--mute);font:500 15px var(--font);text-decoration:none;padding:6px 0;transition:color .25s}
.nav-links a:hover,.nav-links a:focus-visible{color:var(--paper)}
@media (max-width:640px){.nav-links{display:flex;gap:0;margin-right:12px}.nav-links button{display:none}.nav-links a{font-size:14px}}
@media (max-width:380px){.nav img{width:84px}.nav{gap:10px}}

:root{--mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.ann h1{font-size:clamp(46px,9vw,120px);font-weight:800;letter-spacing:-.05em;line-height:.95;margin-bottom:24px}
.ann .sub{color:var(--mute);font-size:clamp(17px,2vw,19px);line-height:1.6;max-width:44ch;margin-bottom:64px}
.card{border-top:1px solid var(--line);padding:40px 0;display:grid;grid-template-columns:190px 1fr;gap:14px 48px}
.card time{font:500 12px/1.8 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.card h2{font-size:clamp(26px,3.6vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-bottom:18px}
.card p{color:var(--mute);font-size:clamp(17px,2vw,19px);line-height:1.65;max-width:60ch;white-space:pre-line}
.card p+p{margin-top:16px}
.empty{color:var(--mute);border-top:1px solid var(--line);padding:40px 0}
.ann .btn{margin-top:48px}
@media(max-width:700px){.card{grid-template-columns:1fr;padding:32px 0}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vig"></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)},reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv=$("#bg"), ctx=cv.getContext("2d"), W,H,streaks=[];
  var mx=.5,my=.45,tx=.5,ty=.45,dim=1,targetDim=1,lastMove=-1e5;
  function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:H+Math.random()*H*.4,len:90+Math.random()*260,v:.25+Math.random()*.9,a:.15+Math.random()*.5,w:Math.random()<.15?2:1}}
  function resize(){
    var d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
    streaks=[];for(var i=0,n=Math.round(W/30);i<n;i++)streaks.push(mk(true));
  }
  function frame(t){
    if(t-lastMove>2500){tx=.5+.22*Math.sin(t/5000);ty=.45+.12*Math.cos(t/7000)}
    mx+=(tx-mx)*.04;my+=(ty-my)*.04;dim+=(targetDim-dim)*.05;
    ctx.clearRect(0,0,W,H);
    var g=ctx.createRadialGradient(mx*W,my*H,0,mx*W,my*H,Math.max(W,H)*.6);
    g.addColorStop(0,"rgba(255,26,26,"+(.26*dim)+")");
    g.addColorStop(.5,"rgba(120,0,0,"+(.09*dim)+")");
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    for(var i=0;i<streaks.length;i++){
      var s=streaks[i];
      if(!reduced)s.y-=s.v;
      if(s.y+s.len<0)streaks[i]=s=mk(false);
      var near=1-Math.min(1,Math.abs(s.x-mx*W)/(W*.35));
      var al=s.a*(.2+.9*near)*dim;
      var lg=ctx.createLinearGradient(0,s.y,0,s.y+s.len);
      lg.addColorStop(0,"rgba(255,235,235,"+al+")");
      lg.addColorStop(.25,"rgba(255,26,26,"+al*.9+")");
      lg.addColorStop(1,"rgba(255,26,26,0)");
      ctx.strokeStyle=lg;ctx.lineWidth=s.w;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x,s.y+s.len);ctx.stroke();
    }
    if(!reduced)requestAnimationFrame(frame);
  }
  resize();addEventListener("resize",resize);
  addEventListener("pointermove",function(e){tx=e.clientX/W;ty=e.clientY/H;lastMove=performance.now()});
  requestAnimationFrame(frame);

  
  var list=$('#list'),io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
  function arm(){document.querySelectorAll('.rv:not(.in)').forEach(function(el){io.observe(el)})}
  function parse(t){
    return t.replace(/\r/g,'').split(/\n---+[ \t]*(?:\n|$)/).map(function(b){
      var o={title:'',date:'',message:''},inMsg=false,m=[];
      b.split('\n').forEach(function(l){
        if(inMsg){m.push(l);return}
        if(/^\s*\/\//.test(l))return;
        var k=l.match(/^\s*(title|date|message)\s*:\s?(.*)$/i);if(!k)return;
        var key=k[1].toLowerCase();
        if(key==='message'){inMsg=true;m.push(k[2])}else o[key]=k[2].trim();
      });
      o.message=m.join('\n').trim();return o;
    }).filter(function(o){return o.title||o.message});
  }
  function fmt(d){var x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
  function card(o,i){
    var c=document.createElement('article');c.className='card rv';c.style.setProperty('--d',Math.min(i,5)*.08+'s');
    var t=document.createElement('time');t.textContent=fmt(o.date);
    var d=document.createElement('div'),h=document.createElement('h2');h.textContent=o.title;d.append(h);
    o.message.split(/\n{2,}/).forEach(function(p){if(!p)return;var e=document.createElement('p');e.textContent=p;d.append(e)});
    c.append(t,d);return c;
  }
  function note(msg){list.textContent='';var p=document.createElement('p');p.className='empty rv';p.textContent=msg;list.append(p);arm()}
  fetch('/announcements.txt',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
    var items=parse(t).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
    if(!items.length)return note('nothing here yet. check back soon.');
    list.textContent='';items.forEach(function(o,i){list.append(card(o,i))});arm();
  }).catch(function(){note("couldn't load announcements. try again in a moment.")});
  arm();
})();
</script>
